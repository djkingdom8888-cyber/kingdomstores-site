<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Kingdom Live | Kingdom Stores{% endblock %}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;800&display=swap');
  :root{
    --black:#0a0a0a; --white:#ffffff; --red:#c8102e;
    --gray:#f4f4f4; --line:#e5e5e5; --text-gray:#666666;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; color:var(--black); background:var(--white);}
  h1,h2,h3,.display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.5px; text-transform:uppercase;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  header{border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--white); z-index:50;}
  .nav-wrap{display:flex; align-items:center; justify-content:space-between; padding:18px 24px;}
  .logo{font-family:'Bebas Neue', sans-serif; font-size:24px; line-height:0.95; text-transform:uppercase;}
  .logo .red{color:var(--red);}
  nav ul{display:flex; gap:28px; list-style:none; font-size:13px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;}
  nav ul li a:hover{color:var(--red);}
  .btn{display:inline-block; background:var(--black); color:var(--white); padding:12px 24px; font-weight:800;
       font-size:12.5px; letter-spacing:1.3px; text-transform:uppercase; border:2px solid var(--black); cursor:pointer; transition:0.2s;}
  .btn:hover{background:var(--white); color:var(--black);}
  .btn-red{background:var(--red); border-color:var(--red); color:var(--white);}
  .btn-red:hover{background:var(--white); color:var(--red);}
  .btn-outline{background:transparent; color:var(--black);}
  .btn-sm{padding:8px 16px; font-size:11.5px;}
  .btn[disabled]{opacity:0.4; cursor:not-allowed;}
  .section{padding:40px 0 64px;}
  .eyebrow{color:var(--red); font-weight:800; font-size:12px; letter-spacing:2px; text-transform:uppercase;}
  .status-badge{display:inline-block; padding:5px 12px; border-radius:3px; font-size:11px; font-weight:800; letter-spacing:1px;}
  .status-badge.live{background:var(--red); color:var(--white);}
  .status-badge.scheduled{background:var(--gray); color:var(--black); border:1px solid var(--line);}
  .status-badge.ended{background:var(--black); color:var(--white);}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:20px;}
  .media-card{border:1px solid var(--line); display:block; background:var(--white); transition:0.15s;}
  .media-card:hover{border-color:var(--black);}
  .media-card .thumb{background:var(--gray); height:150px; display:flex; align-items:center; justify-content:center;
                      font-size:34px; position:relative;}
  .media-card .badge-kind{position:absolute; top:10px; left:10px; background:var(--black); color:var(--white);
                           font-size:10px; font-weight:800; letter-spacing:1px; padding:4px 8px;}
  .media-card .body{padding:14px 16px;}
  .media-card .body h3{font-size:16px; margin-bottom:4px;}
  .media-card .body p{font-size:12.5px; color:var(--text-gray);}
  .empty-note{color:var(--text-gray); font-size:13.5px;}
  .live-grid{display:grid; grid-template-columns:1fr 320px; gap:24px; align-items:start;}
  @media (max-width:900px){ .live-grid{grid-template-columns:1fr;} }
  .live-stage{background:#000; border-radius:6px; overflow:hidden; position:relative;}
  .live-stage video, .live-stage canvas{width:100%; display:block; aspect-ratio:16/9; background:#000;}
  .chat-panel{border:1px solid var(--line); display:flex; flex-direction:column; height:520px;}
  .chat-head{padding:12px 16px; border-bottom:1px solid var(--line); font-family:'Bebas Neue', sans-serif;
             letter-spacing:0.5px; text-transform:uppercase; font-size:15px;}
  .chat-messages{flex:1; overflow-y:auto; padding:12px 16px; font-size:13px;}
  .chat-messages .msg{margin-bottom:10px; line-height:1.4;}
  .chat-messages .msg strong{display:block; font-size:11.5px; color:var(--red); text-transform:uppercase; letter-spacing:0.5px;}
  .chat-input-row{display:flex; border-top:1px solid var(--line);}
  .chat-input-row input{flex:1; border:none; padding:12px 14px; font-size:13px; font-family:inherit;}
  .chat-input-row input:focus{outline:none;}
  .camera-request-row{display:flex; align-items:center; justify-content:space-between; gap:12px;
                       border:1px solid var(--line); padding:10px 14px; margin-bottom:8px; font-size:13px;}
  .camera-request-info{flex:1;}
  .camera-preview-video{width:96px; height:72px; object-fit:cover; background:#000; border:2px solid var(--black);
                         border-radius:3px; flex-shrink:0;}
  .player-shell{background:#000;}
  .player-shell video{width:100%; display:block; max-height:70vh;}
  .inline-field{display:flex; gap:10px;}
  .inline-field input{flex:1; padding:12px 14px; border:1px solid var(--line); font-size:14px; font-family:inherit;}
  .stage-controls{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  #filter-select{background:var(--white); border:2px solid var(--black); color:var(--black); padding:9px 12px;
                 font-size:11.5px; font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:0.5px;
                 font-weight:800; cursor:pointer;}
  .hidden{display:none !important;}
  .live-alert-banner{background:var(--red); color:var(--white); font-weight:800; font-size:13px;
                      letter-spacing:0.3px; padding:14px 18px; border-radius:3px; margin-bottom:24px;}
  .waiting-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                    color:var(--white); font-size:14px; font-weight:700; text-align:center; padding:24px;
                    letter-spacing:0.3px; background:rgba(0,0,0,0.6); line-height:1.5;}
  .waiting-overlay.error{color:#ff9b9b;}
  footer{border-top:1px solid var(--line); padding:24px; text-align:center; font-size:12px; color:var(--text-gray);}
</style>
</head>
<body>
<header>
  <div class="nav-wrap">
    <a href="/" class="logo">KINGDOM<br><span class="red">STORES.</span></a>
    <nav>
      <ul>
        <li><a href="/#shop">Shop</a></li>
        <li><a href="/#music">Music</a></li>
        <li><a href="/live">Live</a></li>
      </ul>
    </nav>
    <a href="/live" class="btn btn-red btn-sm">&#9679; Kingdom Live</a>
  </div>
</header>

{% block content %}{% endblock %}

<footer>
  &copy; 2026 KINGDOM STORES. All rights reserved. &middot; <a href="/" style="text-decoration:underline;">Back to store</a>
</footer>
</body>
</html>
